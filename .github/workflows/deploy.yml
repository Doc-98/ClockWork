name: Pubblica su GitHub Pages

# Il sito si aggiorna solo quando pubblichi una release (non pre-release).
# I push su main vengono solo controllati da ci.yml.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Il tag corrisponde alla versione in package.json
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          versione="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$versione" ]; then
            echo "::error::Il tag della release è $tag ma package.json dice $versione. Aggiorna la versione o rifai il tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Client ID OAuth di Google (pubblico, non è un segreto): Settings → Secrets and variables → Actions → Variables
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
